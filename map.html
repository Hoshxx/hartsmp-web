<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HartSMP | Live Map</title>
    <link rel="stylesheet" href="/tw.css">
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    <header class="p-4 bg-slate-900 border-b border-white/10 flex justify-between items-center">
        <h1 class="font-bold text-lg">HartSMP Live Map</h1>
        <a href="/" class="text-sm text-pink-400 hover:underline">← Back to Home</a>
    </header>

    <!-- Shown only to whitelisted members. Served through the /bluemap/ rewrite in vercel.json,
         so the browser stays on https and never sees the server IP or port. -->
    <div id="map-container" class="flex-1 hidden">
        <iframe src="/bluemap/" title="HartSMP live map" class="w-full h-full border-0"></iframe>
    </div>

    <div id="denied-box" class="flex-1 flex flex-col items-center justify-center p-4 text-center">
        <h2 class="text-2xl font-bold mb-2">Access Restricted</h2>
        <p id="denied-msg" class="text-slate-400 mb-6">Checking your access…</p>
        <a href="/" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 rounded-xl font-bold transition-colors">Go to Whitelist Page</a>
    </div>

    <script>
        (async () => {
            const msg = document.getElementById('denied-msg');
            try {
                const user = await (await fetch('/api/me')).json();
                if (user.loggedIn && user.whitelisted) {
                    document.getElementById('map-container').classList.remove('hidden');
                    document.getElementById('denied-box').classList.add('hidden');
                    return;
                }
                msg.textContent = user.loggedIn
                    ? 'Your Discord account is not whitelisted yet.'
                    : 'Log in with Discord on the home page to view the live world map.';
            } catch (e) {
                msg.textContent = 'Could not verify your login. Try again in a moment.';
            }
        })();
    </script>
</body>
</html>
