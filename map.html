<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HartSMP | Secure Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col">
    <!-- Navbar / Back button -->
    <header class="p-4 bg-slate-900 border-b border-white/10 flex justify-between items-center">
        <h1 class="font-bold text-lg">HartSMP Live Map</h1>
        <a href="/" class="text-sm text-pink-400 hover:underline">← Back to Home</a>
    </header>

    <!-- Map Container (Hidden until verified) -->
    <div id="map-container" class="flex-1 hidden">
        <!-- Updated with your server IP and BlueMap port 25759 -->
        <iframe src="http://51.79.149.23:25759" class="w-full h-full border-0"></iframe>
    </div>

    <!-- Access Denied Message (Shown if not whitelisted) -->
    <div id="denied-box" class="flex-1 flex flex-col items-center justify-center p-4 text-center">
        <h2 class="text-2xl font-bold mb-2">Access Restricted</h2>
        <p class="text-slate-400 mb-6">You must be logged in and whitelisted to view the live world map.</p>
        <a href="/" class="px-6 py-3 bg-pink-600 hover:bg-pink-500 rounded-xl font-bold transition-colors">Go to Whitelist Page</a>
    </div>

    <script>
        async function checkAccess() {
            try {
                const res = await fetch('/api/me');
                const user = await res.json();
                
                if (user.loggedIn && user.whitelisted) {
                    document.getElementById('map-container').classList.remove('hidden');
                    document.getElementById('denied-box').classList.add('hidden');
                }
            } catch (e) {
                console.error(e);
            }
        }
        checkAccess();
    </script>
</body>
</html>
